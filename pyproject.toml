[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "game-feature-council"
version = "0.1.0"
description = "Repository-grounded game feature evaluation CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai-agents==0.22.0",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "typer==0.27.1",
]

[project.scripts]
council = "council.cli:console_main"

[tool.setuptools.packages.find]
include = ["council*"]
